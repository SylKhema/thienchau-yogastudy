name: Publish Yoga Study
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare verified website
        run: |
          cat site-part-00 site-part-01 site-part-02 site-part-03 > /tmp/site.tar.gz
          echo '1ac6de959e146e23c4219e6b22c9269b769670a7a8cf9a14392ae04e16e8e3b5  /tmp/site.tar.gz' | sha256sum --check
          mkdir _site
          tar -xzf /tmp/site.tar.gz -C _site
          if [ -d updates ]; then cp -a updates/. _site/; fi
          rm -f _site/README.md
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
